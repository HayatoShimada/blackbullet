name: db-view
build:
  - in: ./ui/index.tsx
    out: ./assets/db-view.js
  - type: sass
    in: ./ui/db-view.scss
    out: ./assets/db-view.css
assets:
  - "assets/**"
functions:
  render:
    path: ./src/functions.ts:render
  query:
    path: ./src/functions.ts:query
  indexedModified:
    path: ./src/functions.ts:indexedModified
  updatePageValue:
    path: ./src/functions.ts:updatePageValue
  updateTask:
    path: ./src/functions.ts:updateTask
  createRow:
    path: ./src/functions.ts:createRow
  deleteRow:
    path: ./src/functions.ts:deleteRow
  restoreTrashed:
    path: ./src/functions.ts:restoreTrashed
  archiveRow:
    path: ./src/functions.ts:archiveRow
  duplicateRow:
    path: ./src/functions.ts:duplicateRow
  saveView:
    path: ./src/functions.ts:saveView
  renameRow:
    path: ./src/functions.ts:renameRow
